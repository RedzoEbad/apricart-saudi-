spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apricart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP settings for Supabase Pooler
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.validation-query=select 1
spring.datasource.test-on-borrow=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:${SERVER_PORT:8081}}
server.consumer.baseurl=${SERVER_CONSUMER_BASEURL:http://localhost:8081}

# Optimize startup speed
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false

# FOR LOCALS
#server.consumer.baseurl=http://127.0.0.1:8080/v1
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#----------------------------------------------------------------------
#    Firebase
#----------------------------------------------------------------------

app.firebase-configuration-file=${APP_FIREBASE_CONFIGURATION_FILE:google/apricart-81547-firebase-adminsdk-xccpi-a7204458f5.json}
app.firebase-configuration-json=${APP_FIREBASE_CONFIGURATION_JSON:}

#----------------------------------------------------------------------
# DDL CONFIGURATION
#----------------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type=info
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#----------------------------------------------------------------------
# LOGGING
#----------------------------------------------------------------------

logging.file.name=./logs/apricart-spring-boot-backend.log
logging.level.root=info
logging.level.org.hibernate=info
logging.level.org.springframework.web=info
logging.level.design.boilerplate.springboot=info
#----------------------------------------------------------------------
# ACTUATOR
#----------------------------------------------------------------------

management.endpoints.web.exposure.include=*
management.health.redis.enabled=false
management.health.mail.enabled=false

#----------------------------------------------------------------------
# Misc
#----------------------------------------------------------------------

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.task.scheduling.pool.size=20
spring.mvc.async.request-timeout=250000

